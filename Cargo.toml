[package]
name = "node-bridge"
version = "1.3.3"
edition = "2021"
description = "分布式节点统一桥（mac-mini 中枢 × i9/mbp/门店节点）— 协议 v1.0 通道不变"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
chrono = { version = "0.4.45", features = ["clock"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
